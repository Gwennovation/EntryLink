# Weekly dependency update PRs. CI runs on each one, so a bad update shows up as a failed check.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  # Expo pins package versions to its SDK, so routine bumps would break the app. Only security
  # fixes are opened here (needs Dependabot security updates enabled in the repo settings);
  # upgrade the SDK itself with `npx expo install --fix`.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
